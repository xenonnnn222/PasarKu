# Dipasang oleh deploy/server-setup.sh ke /etc/fail2ban/jail.d/pasarku.conf (checklist OWASP I6, G5).
# @SSH_PORTS@ dan @LOG_TZ@ diisi otomatis (port SSH aktif, zona waktu log Laravel).
[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
port    = @SSH_PORTS@

# Brute force PIN di halaman login PasarKu.
[pasarku-login]
enabled     = true
filter      = pasarku-login
port        = http,https
logpath     = /var/www/html/pasarku/storage/logs/security.log
logtimezone = @LOG_TZ@
maxretry    = 10
