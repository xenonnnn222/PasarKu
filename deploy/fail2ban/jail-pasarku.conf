# Dipasang oleh deploy/hardening-server.sh ke /etc/fail2ban/jail.d/pasarku.conf.
# @SSH_PORTS@ diganti dengan port SSH yang aktif.
[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
backend  = auto

[sshd]
enabled = true
port    = @SSH_PORTS@
backend = systemd

# Brute force PIN di halaman login PasarKu.
[pasarku-login]
enabled  = true
filter   = pasarku-login
port     = http,https
logpath  = /var/www/html/pasarku/storage/logs/security.log
maxretry = 10
