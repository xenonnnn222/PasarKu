; Pool PHP-FPM khusus PasarKu (checklist OWASP H6). Dipasang oleh deploy/server-setup.sh ke
; /etc/php/8.3/fpm/pool.d/pasarku.conf. Hanya website PasarKu (lihat SetHandler di apache-pasarku.conf)
; yang memakai socket ini, jadi situs PHP lain di server tidak terpengaruh. CLI (artisan, composer)
; juga tidak terpengaruh.
[pasarku]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-pasarku.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Fungsi eksekusi perintah sistem dimatikan untuk website.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
