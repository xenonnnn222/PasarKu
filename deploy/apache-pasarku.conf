# Enable mod_rewrite and the server's PHP 8.3+ handler before enabling this file.
# This preserves http://SERVER/registration-mis/ without exposing the project root.
RedirectMatch 301 ^/registration-mis$ /registration-mis/
Alias /registration-mis /var/www/pasarku/current/public

<Directory /var/www/pasarku/current/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
