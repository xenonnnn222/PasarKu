# Serve http(s)://SERVER/pasarku/ from Laravel's public directory with PHP 8.3-FPM.
# Jenkins rsyncs the project into /var/www/html/pasarku (inside Apache's document root),
# so everything except public/ must be blocked: .env, database, storage, vendor.
# Requires: a2enmod rewrite proxy_fcgi setenvif, and php8.3-fpm running.
RedirectMatch 301 ^/pasarku$ /pasarku/
RedirectMatch 302 ^/registration-mis(/.*)?$ /pasarku$1
Alias /pasarku /var/www/html/pasarku/public

<Directory /var/www/html/pasarku>
    Require all denied
    AllowOverride None
</Directory>

<Directory /var/www/html/pasarku/public>
    Options -Indexes +FollowSymLinks -MultiViews
    # Rules live here instead of public/.htaccess because Alias needs RewriteBase.
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    # FPM handler scoped to this directory so other PHP sites keep their own PHP version.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    RewriteEngine On
    RewriteBase /pasarku/

    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    RewriteCond %{HTTP:x-xsrf-token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} (.+)/$
    RewriteRule ^ %1 [L,R=301]

    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</Directory>
