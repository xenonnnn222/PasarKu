# PasarKu versi Node.js di https://DOMAIN/pasarku-node/
# Apache meneruskan permintaan ke service lokal di 127.0.0.1:3100.
# Tidak menyentuh konfigurasi PasarKu Laravel di /pasarku/.
# Dipasang oleh deploy/siapkan-server.sh ke /etc/apache2/conf-available/pasarku-node.conf

RedirectMatch 301 ^/pasarku-node$ /pasarku-node/

<Location "/pasarku-node/">
    ProxyPass "http://127.0.0.1:3100/" retry=0 timeout=30
    ProxyPassReverse "http://127.0.0.1:3100/"
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</Location>
